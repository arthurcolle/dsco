# DSCO prompt panes — interactive sessions, not log viewers or test fixtures.
# No auto-launch, prompt injection, selection/scrollback copying or grant changes.
# Pressing a launch shortcut creates a separate native DSCO process; normal
# provider configuration, session policy, capability gates and costs still apply.
# Review is a title, NOT a read-only sandbox or an enforced evaluator role.

# Command–Option–Enter: a new sidechat beside the current pane.
map super+alt+enter combine : goto_layout splits : launch --type=window --location=vsplit --cwd=current --title=DSCO-sidechat --env=DSCO_KITTY_AGENT_WINDOWS=0 ~/.local/bin/dsco --tui
# Command–Option–Shift–Enter: a data-review chat below the current pane.
map super+alt+shift+enter combine : goto_layout splits : launch --type=window --location=hsplit --cwd=current --title=DSCO-data-review --env=DSCO_KITTY_AGENT_WINDOWS=0 ~/.local/bin/dsco --tui
# Command–Option–N: put a new prompt workspace in another tab, not another split.
map super+alt+n launch --type=tab --cwd=current --title=DSCO-prompt-workspace --env=DSCO_KITTY_AGENT_WINDOWS=0 ~/.local/bin/dsco --tui

# Command–Option–B opens the local browser buffer workbench on explicit request.
# This is a browser workspace, not a native terminal pane or a swarm dispatcher.
map super+alt+b launch --type=background /usr/bin/open /Users/arthurcolle/dsco/dsco-cli/.workspace/prompt-fabric/index.html

# Visibility and navigation. Hidden views continue to run; this does not cancel.
map super+alt+z toggle_layout stack
map super+alt+[ previous_window
map super+alt+] next_window
map super+alt+1 nth_window 0
map super+alt+2 nth_window 1
map super+alt+3 nth_window 2
map super+alt+4 nth_window 3
map super+alt+5 nth_window 4
map super+alt+6 nth_window 5
map super+alt+7 nth_window 6
map super+alt+8 nth_window 7
map super+alt+9 nth_window 8
map super+alt+g goto_layout grid
map super+alt+t goto_layout tall
map super+alt+s goto_layout splits
map super+alt+l next_layout
map super+alt+0 resize_window reset
