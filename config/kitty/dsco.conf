# DSCO — Copper & Ice. Kitty 0.47+ for draggable pane title bars.
# Include after your existing kitty.conf settings. No global remote control.
background #0b111a
foreground #e2edf4
background_opacity 0.94
selection_background #294451
selection_foreground #f4f8fb
cursor #e2a674
cursor_text_color #0b111a
cursor_shape beam
cursor_trail 3
cursor_trail_decay 0.08 0.18
cursor_trail_start_threshold 3
url_color #86dae6
color0 #152331
color1 #e68190
color2 #91d1ad
color3 #e2a674
color4 #88b9ea
color5 #b2a2e0
color6 #86dae6
color7 #c9d8e3
color8 #6e879b
color9 #f38791
color10 #b0e8c6
color11 #f2c77f
color12 #aed4ff
color13 #d2c2ff
color14 #b5f2fa
color15 #f4f8fb

enabled_layouts splits,tall,grid,stack
window_padding_width 8
window_margin_width 3
window_border_width 1.5pt
active_border_color #86dae6
inactive_border_color #263949
inactive_text_alpha 0.88
window_drag_tolerance 6
window_title_bar top
window_title_bar_min_windows 2
window_title_bar_align left
window_title_template " ⧉ {title} "
active_window_title_template " ⍼ {title} "
window_title_bar_active_foreground #e2edf4
window_title_bar_active_background #243b49
window_title_bar_inactive_foreground #8ba0b1
window_title_bar_inactive_background #121c27
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {index}  {title} "
active_tab_foreground #0b111a
active_tab_background #86dae6
active_tab_font_style bold
inactive_tab_foreground #8ba0b1
inactive_tab_background #192633
tab_bar_background #0b111a
macos_titlebar_color background

# Focus / move / resize. Arrow keys alone still belong to the application.
map super+alt+left neighboring_window left
map super+alt+right neighboring_window right
map super+alt+up neighboring_window up
map super+alt+down neighboring_window down
map super+alt+shift+left move_window left
map super+alt+shift+right move_window right
map super+alt+shift+up move_window up
map super+alt+shift+down move_window down
map super+ctrl+left resize_window narrower 2
map super+ctrl+right resize_window wider 2
map super+ctrl+up resize_window taller 2
map super+ctrl+down resize_window shorter 2
# Visibility is not lifecycle: stack shows one pane without closing its peers.
# Toggle again to return to the previous layout. In stack, use [ / ] to select
# another running pane; directional navigation is for visible split neighbours.
map super+alt+z toggle_layout stack
map super+alt+bracketleft previous_window
map super+alt+bracketright next_window
map super+alt+1 nth_window 0
map super+alt+2 nth_window 1
map super+alt+3 nth_window 2
map super+alt+4 nth_window 3
map super+alt+5 nth_window 4
map super+alt+6 nth_window 5
map super+alt+7 nth_window 6
map super+alt+8 nth_window 7
map super+alt+9 nth_window 8
# Explicit layouts are easier to recover than cycling through an unknown state.
map super+alt+g goto_layout grid
map super+alt+t goto_layout tall
map super+alt+s goto_layout splits
map super+alt+l next_layout
map super+alt+0 resize_window reset

# Open the established TUI; swarm cards live inside dsco, with no remote control.
# launch expands ~ for the executable; use the installed dsco from this repo.
map super+shift+enter launch --type=tab --title=⦇ᴀʀᴛʜᴜʀᴄᴏʟʟᴇ⦈ --env=DSCO_THEME=copper-ice --env=DSCO_KITTY_SIGNATURE=ᴀʀᴛʜᴜʀᴄᴏʟʟᴇ --env=DSCO_KITTY_AGENT_WINDOWS=0 ~/.local/bin/dsco --tui

# Theme and identity for ordinary dsco launches in newly created Kitty shells.
env DSCO_THEME=copper-ice
env DSCO_KITTY_SIGNATURE=ᴀʀᴛʜᴜʀᴄᴏʟʟᴇ

env DSCO_KITTY_AGENT_WINDOWS=0

# User-created interactive sidechats and review panes (not swarm auto-popups).
include prompt-panes.conf
